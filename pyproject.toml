[project]
name = "atelier-4-agentic-rag-streamlit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Leila", email = "leilabougatefmaster@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.2",
    "chromadb>=1.5.9",
    "langchain>=1.4.8",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.19",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "tavily-python>=0.8.5",
    "tiktoken>=0.14.0",
]

[project.scripts]
atelier-4-agentic-rag-streamlit = "atelier_4_agentic_rag_streamlit:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
